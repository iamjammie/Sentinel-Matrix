<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="SENTINEL MATRIX — offline enterprise SIEM detection coverage intelligence, rule audit and detection engineering platform.">
<meta name="color-scheme" content="dark">
<title>SENTINEL MATRIX</title>
<style>/* SENTINEL MATRIX — design system (system fonts only, no external resources) */
:root{
  --bg-0:#070b14;--bg-1:#0b1220;--bg-2:#111a2c;--bg-3:#172238;--bg-4:#1e2b45;
  --glass:rgba(17,26,44,.72);--glass-border:rgba(120,160,220,.14);
  --text-0:#e8eef9;--text-1:#b3c0d8;--text-2:#7d8ba6;--text-3:#55607a;
  --cyan:#19d3f3;--cyan-dim:rgba(25,211,243,.16);--blue:#3b82f6;--violet:#8b5cf6;
  --amber:#f5b942;--red:#f0506e;--green:#2fd48b;--orange:#fb8c3c;--grey:#4a5670;
  --cov-validated:#2fd48b;--cov-operational:#19d3f3;--cov-partial:#e5d04a;--cov-weak:#fb8c3c;--cov-none:#f0506e;--cov-na:#4a5670;--cov-unknown:#2a3449;
  --radius:10px;--radius-sm:6px;--sidebar-w:236px;--topbar-h:54px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(139,92,246,.10),transparent 60%),var(--bg-0);color:var(--text-0);font:13.5px/1.45 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
code,pre,.mono{font-family:var(--mono);font-size:12px}
pre{background:var(--bg-1);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:10px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;margin:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.sr-only{position:absolute;left:-9999px}

/* layout */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;height:100vh;transition:grid-template-columns .2s}
#app.collapsed{grid-template-columns:60px 1fr}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);z-index:5}
#sidebar{background:linear-gradient(180deg,var(--bg-1),var(--bg-0));border-right:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden}
#main{overflow:auto;padding:20px 24px 40px;position:relative}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.brand .logo{width:30px;height:30px;flex:none}
.brand .name{font-weight:700;letter-spacing:.14em;font-size:13px}
.brand .tag{font-size:10px;color:var(--text-2);letter-spacing:.04em}
#app.collapsed .brand .name,#app.collapsed .brand .tag{display:none}
#app.collapsed .brand{min-width:0}
.topbar-mid{flex:1;display:flex;align-items:center;gap:10px}
.topbar-right{display:flex;align-items:center;gap:8px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--glass-border);background:var(--bg-2);font-size:11.5px;color:var(--text-1);white-space:nowrap}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.status-pill.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-pill.warn .dot{background:var(--amber)}
.status-pill.err .dot{background:var(--red)}
.status-pill.info .dot{background:var(--cyan)}
#global-search{flex:1;max-width:520px;position:relative}
#global-search input{width:100%;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;padding:7px 12px 7px 32px;color:var(--text-0);outline:none}
#global-search input:focus{border-color:var(--cyan)}
#global-search .icon{position:absolute;left:10px;top:8px;color:var(--text-2)}
#search-results{position:absolute;top:38px;left:0;right:0;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:8px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50;display:none}
#search-results.open{display:block}
.sr-item{padding:8px 12px;border-bottom:1px solid var(--glass-border);cursor:pointer;display:flex;gap:10px;align-items:center}
.sr-item:hover{background:var(--bg-3)}
.sr-item .kind{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);min-width:72px}
.sr-item .sub{color:var(--text-2);font-size:11.5px}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text-1);position:relative}
.icon-btn:hover{background:var(--bg-3);border-color:var(--glass-border)}
.badge-count{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9.5px;border-radius:999px;padding:1px 5px;min-width:16px;text-align:center}

/* sidebar nav */
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-1);font-size:12.5px;margin-bottom:2px;border:1px solid transparent;white-space:nowrap;position:relative}
.nav-item:hover{background:var(--bg-2);color:var(--text-0)}
.nav-item.active{background:linear-gradient(90deg,rgba(25,211,243,.14),rgba(59,130,246,.06));border-color:rgba(25,211,243,.3);color:var(--text-0)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;background:var(--cyan);border-radius:2px;box-shadow:0 0 10px var(--cyan)}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav-item .n{font-size:10px;color:var(--text-3);width:16px;text-align:right}
#app.collapsed .nav-item span.label,#app.collapsed .nav-item .n{display:none}
#app.collapsed .nav-item{justify-content:center;padding:9px 0}
.nav-section{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 4px}
#app.collapsed .nav-section{display:none}
.sidebar-foot{padding:10px;border-top:1px solid var(--glass-border);font-size:11px;color:var(--text-2)}
.sidebar-foot .ver{font-family:var(--mono);color:var(--text-3)}
#app.collapsed .sidebar-foot .txt{display:none}

/* page */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.page-head .sub{color:var(--text-2);margin-top:3px;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--bg-3);border:1px solid var(--glass-border);border-radius:8px;padding:7px 13px;cursor:pointer;color:var(--text-0);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--bg-4);border-color:rgba(120,160,220,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,rgba(25,211,243,.22),rgba(59,130,246,.22));border-color:rgba(25,211,243,.45);color:#dffaff}
.btn.primary:hover{background:linear-gradient(135deg,rgba(25,211,243,.32),rgba(59,130,246,.32))}
.btn.danger{border-color:rgba(240,80,110,.45);color:#ffd4dc}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn.ghost{background:transparent}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text-1);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .hint{font-weight:400;font-size:11px;color:var(--text-3)}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.kpi{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
@media (max-width:1250px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}#app{grid-template-columns:60px 1fr}}
.kpi-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .15s;position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-1px);border-color:rgba(25,211,243,.4)}
.kpi-card .label{font-size:11px;color:var(--text-2);letter-spacing:.03em;text-transform:uppercase}
.kpi-card .value{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-card .delta{font-size:11px;color:var(--text-2);margin-top:2px}
.kpi-card.c-cyan .value{color:var(--cyan)}.kpi-card.c-red .value{color:var(--red)}.kpi-card.c-amber .value{color:var(--amber)}.kpi-card.c-green .value{color:var(--green)}.kpi-card.c-violet .value{color:var(--violet)}.kpi-card.c-orange .value{color:var(--orange)}
.kpi-card::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(25,211,243,.12),transparent 70%)}
.demo-banner{background:linear-gradient(90deg,rgba(245,185,66,.16),rgba(245,185,66,.04));border:1px solid rgba(245,185,66,.45);color:#ffe3a8;border-radius:8px;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.empty{padding:40px 20px;text-align:center;color:var(--text-2);border:1px dashed var(--glass-border);border-radius:var(--radius)}
.empty h4{margin:0 0 6px;color:var(--text-1)}
.muted{color:var(--text-2)}.small{font-size:11.5px}.xs{font-size:10.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.mt{margin-top:14px}.mb{margin-bottom:14px}
hr.sep{border:0;border-top:1px solid var(--glass-border);margin:14px 0}

/* tags & badges */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:10.5px;background:var(--bg-3);border:1px solid var(--glass-border);color:var(--text-1);white-space:nowrap;font-family:var(--mono)}
.tag.cyan{color:var(--cyan);border-color:rgba(25,211,243,.4);background:var(--cyan-dim)}
.tag.red{color:#ffb3c0;border-color:rgba(240,80,110,.45);background:rgba(240,80,110,.14)}
.tag.amber{color:#ffe0a3;border-color:rgba(245,185,66,.45);background:rgba(245,185,66,.14)}
.tag.green{color:#b8f5d6;border-color:rgba(47,212,139,.45);background:rgba(47,212,139,.14)}
.tag.violet{color:#d9c8ff;border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.14)}
.tag.orange{color:#ffd1b3;border-color:rgba(251,140,60,.45);background:rgba(251,140,60,.14)}
.tag.grey{color:var(--text-2)}
.tag.inferred{border-style:dashed}
.sev-critical{color:#ff8da0}.sev-high{color:var(--orange)}.sev-medium{color:var(--amber)}.sev-low{color:var(--cyan)}.sev-info{color:var(--text-2)}
.cov-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--text-2);letter-spacing:.03em;text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--bg-1);border:1px solid var(--glass-border);border-radius:7px;padding:7px 10px;color:var(--text-0);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}
.field textarea{min-height:90px;font-family:var(--mono);font-size:12px;resize:vertical}
select option{background:var(--bg-1)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;padding:12px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius)}
.filterbar .field{min-width:140px}
.filterbar .field input,.filterbar .field select{padding:5px 8px;font-size:12px}
.dropzone{border:2px dashed rgba(25,211,243,.35);border-radius:var(--radius);padding:34px;text-align:center;color:var(--text-2);background:rgba(25,211,243,.03);cursor:pointer;transition:background .15s}
.dropzone.over,.dropzone:hover{background:rgba(25,211,243,.08)}
.dropzone strong{color:var(--text-0)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--glass-border);color:var(--text-2);background:var(--bg-1)}
.step.done{color:var(--green);border-color:rgba(47,212,139,.4)}
.step.active{color:var(--cyan);border-color:rgba(25,211,243,.5);background:var(--cyan-dim)}

/* tables */
.vtable{border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;background:var(--bg-1)}
.vtable .thead{display:grid;background:var(--bg-2);border-bottom:1px solid var(--glass-border);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.vtable .th{padding:8px 10px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.vtable .th:hover{color:var(--text-0)}
.vtable .th .arrow{color:var(--cyan);font-size:9px}
.vtable .body{position:relative;overflow:auto}
.vtable .spacer{position:relative;width:100%}
.vtable .tr{display:grid;position:absolute;left:0;right:0;border-bottom:1px solid rgba(120,160,220,.07);align-items:center;cursor:pointer}
.vtable .tr:hover{background:var(--bg-2)}
.vtable .tr.selected{background:rgba(25,211,243,.08)}
.vtable .td{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.vtable .tfoot{padding:6px 10px;font-size:11px;color:var(--text-2);border-top:1px solid var(--glass-border);background:var(--bg-2);display:flex;justify-content:space-between;align-items:center}
table.plain{width:100%;border-collapse:collapse;font-size:12.5px}
table.plain th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:6px 8px;border-bottom:1px solid var(--glass-border)}
table.plain td{padding:6px 8px;border-bottom:1px solid rgba(120,160,220,.07);vertical-align:top}
table.plain tr:hover td{background:var(--bg-2)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--text-2)}.kv dd{margin:0;word-break:break-word}

/* drawer & modal */
#drawer{position:fixed;top:var(--topbar-h);right:0;bottom:0;width:min(620px,92vw);background:var(--bg-1);border-left:1px solid var(--glass-border);box-shadow:-10px 0 40px rgba(0,0,0,.5);transform:translateX(102%);transition:transform .22s;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
.drawer-head{padding:14px 18px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-head h2{margin:0;font-size:15px}
.drawer-body{padding:16px 18px;overflow:auto;flex:1}
.modal-back{position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center}
.modal-back.open{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--glass-border);border-radius:14px;width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(1100px,96vw)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:15px}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--glass-border);display:flex;justify-content:flex-end;gap:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--glass-border);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;font-size:12.5px;white-space:nowrap}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab:hover{color:var(--text-0)}

/* toasts */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--bg-2);border:1px solid var(--glass-border);border-left:3px solid var(--cyan);border-radius:8px;padding:10px 14px;min-width:260px;max-width:420px;box-shadow:var(--shadow);font-size:12.5px;animation:slide .2s}
.toast.ok{border-left-color:var(--green)}.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.progress{height:6px;background:var(--bg-3);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .2s}
.score-ring{display:inline-grid;place-items:center;position:relative}
.score-ring .val{position:absolute;font-weight:650;font-size:16px}

/* matrix */
.matrix-wrap{overflow:auto;border:1px solid var(--glass-border);border-radius:var(--radius);background:var(--bg-1)}
.matrix{display:grid;grid-auto-flow:column;gap:6px;padding:10px;min-width:max-content}
.tactic-col{width:148px;display:flex;flex-direction:column;gap:3px}
.tactic-head{font-size:11px;font-weight:600;color:var(--text-0);padding:6px 6px;background:var(--bg-3);border-radius:6px;text-align:center;letter-spacing:.02em;position:sticky;top:0}
.tactic-head .cnt{display:block;font-weight:400;color:var(--text-2);font-size:10px}
.tech-cell{font-size:10.5px;padding:4px 6px;border-radius:4px;cursor:pointer;border-left:3px solid var(--grey);background:var(--bg-2);line-height:1.25;transition:filter .1s}
.tech-cell:hover{filter:brightness(1.3)}
.tech-cell .id{font-family:var(--mono);font-size:9.5px;color:var(--text-2)}
.tech-cell.sub{margin-left:10px;font-size:10px;opacity:.95}
.tech-cell[data-cov="VALIDATED"]{border-left-color:var(--cov-validated);background:rgba(47,212,139,.22)}
.tech-cell[data-cov="FULLY_COVERED"]{border-left-color:var(--cov-operational);background:rgba(25,211,243,.2)}
.tech-cell[data-cov="PARTIALLY_COVERED"]{border-left-color:var(--cov-partial);background:rgba(229,208,74,.18)}
.tech-cell[data-cov="WEAK_COVERAGE"],.tech-cell[data-cov="UNVALIDATED_COVERAGE"]{border-left-color:var(--cov-weak);background:rgba(251,140,60,.18)}
.tech-cell[data-cov="NOT_COVERED"]{border-left-color:var(--cov-none);background:rgba(240,80,110,.16)}
.tech-cell[data-cov="NOT_APPLICABLE"]{border-left-color:var(--cov-na);opacity:.55}
.tech-cell[data-cov="UNKNOWN"]{border-left-color:var(--cov-unknown)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-1)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--text-1);font-family:var(--sans);font-size:11px}
.chart .axis line,.chart .axis path{stroke:var(--glass-border)}
.chart .bar:hover{filter:brightness(1.25)}
.tooltip{position:fixed;pointer-events:none;background:var(--bg-2);border:1px solid var(--glass-border);border-radius:6px;padding:6px 10px;font-size:11.5px;z-index:200;box-shadow:var(--shadow);display:none;max-width:320px}

/* chain */
.chain{display:flex;gap:0;overflow-x:auto;padding:10px 0}
.chain-stage{min-width:170px;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:12px;cursor:pointer;position:relative;margin-right:28px;transition:border-color .15s}
.chain-stage:hover{border-color:var(--cyan)}
.chain-stage::after{content:"→";position:absolute;right:-22px;top:40%;color:var(--text-3);font-size:18px}
.chain-stage:last-child::after{content:""}
.chain-stage .st{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.chain-stage .big{font-size:22px;font-weight:650;margin:4px 0}
.chain-stage .bar{height:5px;border-radius:3px;background:var(--bg-3);margin-top:6px;overflow:hidden}
.chain-stage .bar>div{height:100%}

/* lifecycle board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:10px;overflow-x:auto;padding-bottom:10px}
.board-col{background:var(--bg-1);border:1px solid var(--glass-border);border-radius:10px;padding:8px;min-height:200px}
.board-col h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);display:flex;justify-content:space-between}
.board-card{background:var(--bg-2);border:1px solid var(--glass-border);border-radius:7px;padding:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.board-card:hover{border-color:var(--cyan)}
.timeline{border-left:2px solid var(--glass-border);margin-left:6px;padding-left:14px}
.tl-item{position:relative;margin-bottom:10px;font-size:12px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.tl-item .when{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.print-only{display:none}
@media print{body{background:#fff;color:#000}#sidebar,#topbar,#drawer,#toasts{display:none!important}#app{display:block}#main{overflow:visible;padding:0}.card{break-inside:avoid;background:#fff;border-color:#ccc}.print-only{display:block}}
</style>

<script type="application/json" id="data-scenarios">{"framework":"SENTINEL MATRIX Detection Scenario Library","dataset_kind":"bundled","version":"1.0.0","kb":{"T1558.003":{"name":"Kerberoasting","scenarios":[{"id":"KRB-01","name":"Abnormal service ticket request volume","objective":"Detect a single account requesting an unusually high number of Kerberos service tickets (TGS) in a short window.","logic_type":"threshold","severity":"high","keywords":["4769","service ticket","kerberoast"],"event_ids":[4769],"log_source_types":["active_directory","windows_security"],"selection":[{"field":"EventID","op":"eq","value":4769},{"field":"ServiceName","op":"ne","value":"krbtgt"},{"field":"ServiceName","op":"not_in","value":["*$"]}],"exclusions":[],"agg":{"fn":"count","group_by":["TargetUserName"],"threshold":10,"window_minutes":5,"distinct":"ServiceName"},"fp":["Service/monitoring accounts that enumerate many SPNs","Backup software authenticating to many services at startup"],"tuning":["Baseline per-user distinct SPN counts over 30 days before setting the threshold","Exclude known scanner/monitoring accounts via a reference set"],"tests":[{"name":"10 distinct SPNs from one user in 2 minutes","input":{"EventID":4769,"TargetUserName":"jdoe@CORP","distinct_ServiceName":10,"window_minutes":2},"expected":"match"},{"name":"Normal user requesting 2 tickets","input":{"EventID":4769,"TargetUserName":"asmith@CORP","distinct_ServiceName":2,"window_minutes":5},"expected":"no_match"}]},{"id":"KRB-02","name":"Weak encryption-type service ticket (RC4) for SPN accounts","objective":"Detect TGS requests using RC4-HMAC (0x17) for service accounts that normally use AES.","logic_type":"correlation","severity":"high","keywords":["0x17","rc4","TicketEncryptionType"],"event_ids":[4769],"log_source_types":["active_directory","windows_security"],"selection":[{"field":"EventID","op":"eq","value":4769},{"field":"TicketEncryptionType","op":"eq","value":"0x17"},{"field":"ServiceName","op":"ne","value":"krb <script>/* ===== 00_core.js ===== */
/* SENTINEL MATRIX — core utilities, DOM helpers, safe parsers, event bus.
   All modules attach to the SM namespace. No eval, no Function(), no innerHTML with data. */
(function (SM) {
  'use strict';
  SM.VERSION = '1.0.0';
  SM.BUILD_DATE = 'v1.0.0';
  SM.APP_NAME = 'SENTINEL MATRIX';
  SM.TAGLINE = 'See the Gaps. Engineer the Defence. Detect the Adversary.';

  // ---------- Event bus ----------
  const listeners = new Map();
  SM.on = (evt, fn) => { if (!listeners.has(evt)) listeners.set(evt, new Set()); listeners.get(evt).add(fn); return () => listeners.get(evt).delete(fn); };
  SM.emit = (evt, payload) => { (listeners.get(evt) || []).forEach(fn => { try { fn(payload); } catch (e) { console.error('listener error', evt, e); } }); };

  // ---------- IDs / time ----------
  SM.uid = (prefix = 'id') => prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  SM.now = () => new Date().toISOString();
  SM.fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toISOString().replace('T', ' ').slice(0, 16) + 'Z'; };
  SM.fmtNum = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('en-GB');
  SM.pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : 0;
  SM.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- Text helpers ----------
  SM.str = (v) => (v === null || v === undefined) ? '' : (typeof v === 'string' ? v : (typeof v === 'object' ? JSON.stringify(v) : String(v)));
  SM.truncate = (s, n = 80) => { s = SM.str(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  SM.slug = (s) => SM.str(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  SM.uniq = (arr) => Array.from(new Set((arr || []).filter(x => x !== undefined && x !== null && x !== '')));
  SM.asArray = (v) => v === undefined || v === null ? [] : (Array.isArray(v) ? v : [v]);
  SM.groupBy = (arr, fn) => { const m = new Map(); for (const x of arr) { const k = typeof fn === 'function' ? fn(x) : x[fn]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
  SM.countBy = (arr, fn) => { const m = {}; for (const x of arr) { const k = typeof fn === 'function' ? fn(x) : x[fn]; m[k] = (m[k] || 0) + 1; } return m; };
  SM.sum = (arr, fn) => arr.reduce((a, x) => a + (fn ? fn(x) : x), 0);
  SM.deepClone = (o) => JSON.parse(JSON.stringify(o));
  SM.hash = (s) => { // FNV-1a 32-bit, for duplicate detection fingerprints
    s = SM.str(s); let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16).padStart(8, '0');
  };
  SM.normaliseLogic = (s) => SM.str(s).toLowerCase().replace(/\s+/g, ' ').replace(/['"`]/g, '').trim();

  // ATT&CK ID extraction — strict pattern so random text does not become a mapping
  SM.TECH_RE = /\bT\d{4}(?:\.\d{3})?\b/g;
  SM.extractTechniqueIds = (text) => SM.uniq((SM.str(text).match(SM.TECH_RE) || []).map(x => x.toUpperCase()));
  SM.parentTechnique = (id) => SM.str(id).split('.')[0];

  // ---------- Safe parsing ----------
  SM.safeJSON = (text, { maxBytes = 300 * 1024 * 1024 } = {}) => {
    if (typeof text !== 'string') throw new Error('JSON input must be text');
    if (text.length > maxBytes) throw new Error('JSON input exceeds size limit');
    const t = text.replace(/^﻿/, '');
    // reject prototype pollution keys
    const parsed = JSON.parse(t, (k, v) => (k === '__proto__' || k === 'constructor' || k === 'prototype') ? undefined : v);
    return parsed;
  };

  // Minimal RFC4180-ish CSV parser with quoted fields and embedded newlines
  SM.parseCSV = (text, delimiter) => {
    text = SM.str(text).replace(/^﻿/, '');
    if (!delimiter) { const first = text.split(/\r?\n/)[0] || ''; delimiter = (first.split('\t').length > first.split(',').length) ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ','); }
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
      else if (c === '"') q = true;
      else if (c === delimiter) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return { headers: [], records: [] };
    const headers = rows[0].map(h => h.trim());
    const records = rows.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => { const o = {}; headers.forEach((h, i) => o[h] = r[i] === undefined ? '' : r[i]); return o; });
    return { headers, records, delimiter };
  };
  SM.toCSV = (rows, headers) => {
    if (!rows.length) return '';
    headers = headers || SM.uniq(rows.flatMap(r => Object.keys(r)));
    const esc = (v) => { const s = Array.isArray(v) ? v.join('|') : SM.str(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [headers.join(','), ...rows.map(r => headers.map(h => esc(r[h])).join(','))].join('\r\n');
  };

  // Secure XML parse: DOMParser does not expand external entities; we additionally reject DOCTYPE declarations (XXE/billion-laughs surface)
  SM.parseXML = (text) => {
    text = SM.str(text).replace(/^﻿/, '');
    if (/<!DOCTYPE/i.test(text) || /<!ENTITY/i.test(text)) throw new Error('XML documents containing DOCTYPE/ENTITY declarations are rejected for security reasons');
    if (typeof DOMParser === 'undefined') throw new Error('XML parsing requires a browser DOMParser');
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    const err = doc.getElementsByTagName('parsererror')[0];
    if (err) throw new Error('XML parse error: ' + (err.textContent || '').slice(0, 200));
    return doc;
  };
  SM.xmlToObject = (node) => { // generic element → plain object conversion
    const obj = {};
    if (node.attributes) for (const a of node.attributes) obj['@' + a.name] = a.value;
    const kids = Array.from(node.children || []);
    if (!kids.length) { const t = (node.textContent || '').trim(); return Object.keys(obj).length ? Object.assign(obj, { '#text': t }) : t; }
    for (const k of kids) { const v = SM.xmlToObject(k); if (obj[k.tagName] === undefined) obj[k.tagName] = v; else { if (!Array.isArray(obj[k.tagName])) obj[k.tagName] = [obj[k.tagName]]; obj[k.tagName].push(v); } }
    return obj;
  };

  // Compact YAML subset parser sufficient for Sigma rules (maps, sequences, scalars, block scalars, inline lists). No anchors/tags executed.
  SM.parseYAML = (text) => {
    const lines = SM.str(text).replace(/\r/g, '').split('\n').map(l => l.replace(/\t/g, '  '));
    const docs = []; let cur = [];
    for (const l of lines) { if (/^---\s*$/.test(l)) { if (cur.length) docs.push(cur); cur = []; } else if (/^\.\.\.\s*$/.test(l)) { /* end */ } else cur.push(l); }
    if (cur.length) docs.push(cur);
    const parseScalar = (s) => {
      s = s.trim();
      if (s === '' || s === '~' || s === 'null') return null;
      if (s === 'true') return true; if (s === 'false') return false;
      if (/^-?\d+$/.test(s)) return parseInt(s, 10);
      if (/^-?\d*\.\d+$/.test(s)) return parseFloat(s);
      if ((s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1).replace(/''/g, "'");
      if ((s.startsWith('"') && s.endsWith('"'))) { try { return JSON.parse(s); } catch (e) { return s.slice(1, -1); } }
      if (s.startsWith('[') && s.endsWith(']')) return splitInline(s.slice(1, -1)).map(parseScalar);
      if (s.startsWith('{') && s.endsWith('}')) { const o = {}; splitInline(s.slice(1, -1)).forEach(p => { const i = p.indexOf(':'); if (i > 0) o[p.slice(0, i).trim()] = parseScalar(p.slice(i + 1)); }); return o; }
      return s;
    };
    const splitInline = (s) => { const out = []; let d = 0, q = null, cur = ''; for (const c of s) { if (q) { cur += c; if (c === q) q = null; continue; } if (c === '"' || c === "'") { q = c; cur += c; continue; } if (c === '[' || c === '{') d++; if (c === ']' || c === '}') d--; if (c === ',' && d === 0) { out.push(cur); cur = ''; } else cur += c; } if (cur.trim()) out.push(cur); return out; };
    const stripComment = (l) => { let q = null, out = ''; for (let i = 0; i < l.length; i++) { const c = l[i]; if (q) { out += c; if (c === q) q = null; continue; } if (c === '"' || c === "'") { q = c; out += c; continue; } if (c === '#' && (i === 0 || /\s/.test(l[i - 1]))) break; out += c; } return out; };
    const indentOf = (l) => l.match(/^ */)[0].length;
    function parseBlock(ls, i, indent) {
      // returns [value, nextIndex]
      while (i < ls.length && stripComment(ls[i]).trim() === '') i++;
      if (i >= ls.length) return [null, i];
      const first = stripComment(ls[i]);
      const ind = indentOf(first);
      if (ind < indent) return [null, i];
      if (first.trim().startsWith('- ') || first.trim() === '-') {
        const arr = [];
        while (i < ls.length) {
          const raw = stripComment(ls[i]); if (raw.trim() === '') { i++; continue; }
          if (indentOf(raw) !== ind || !(raw.trim().startsWith('- ') || raw.trim() === '-')) break;
          const rest = raw.trim().slice(1).trim();
          if (rest === '') { const [v, ni] = parseBlock(ls, i + 1, ind + 1); arr.push(v); i = ni; }
          else if (/^[^'"\[{][^:]*:(\s|$)/.test(rest) && !rest.startsWith('http')) {
            // inline mapping start inside a sequence item: rewrite the line as indented map
            const sub = [' '.repeat(ind + 2) + rest]; let j = i + 1;
            while (j < ls.length) { const r = stripComment(ls[j]); if (r.trim() === '') { sub.push(''); j++; continue; } if (indentOf(r) > ind) { sub.push(r); j++; } else break; }
            const [v] = parseBlock(sub, 0, ind + 2); arr.push(v); i = j;
          } else { arr.push(parseScalar(rest)); i++; }
        }
        return [arr, i];
      }
      const obj = {};
      while (i < ls.length) {
        const raw = stripComment(ls[i]); if (raw.trim() === '') { i++; continue; }
        if (indentOf(raw) < ind) break;
        if (indentOf(raw) > ind) { i++; continue; }
        const m = raw.trim().match(/^((?:"[^"]*")|(?:'[^']*')|[^:]+?)\s*:(?:\s+(.*))?$/);
        if (!m) { i++; continue; }
        let key = m[1].trim(); if (/^["']/.test(key)) key = key.slice(1, -1);
        const val = m[2];
        if (val === undefined || val.trim() === '') { const [v, ni] = parseBlock(ls, i + 1, ind + 1); obj[key] = v; i = ni; }
        else if (val.trim() === '|' || val.trim() === '>' || val.trim() === '|-' || val.trim() === '>-') {
          const fold = val.trim().startsWith('>'); const buf = []; let j = i + 1; let bi = null;
          while (j < ls.length) { const r = ls[j]; if (r.trim() === '') { buf.push(''); j++; continue; } const bind = indentOf(r); if (bi === null) bi = bind; if (bind < bi || bind <= ind) break; buf.push(r.slice(bi)); j++; }
          while (buf.length && buf[buf.length - 1] === '') buf.pop();
          obj[key] = fold ? buf.join(' ').replace(/\s+/g, ' ') : buf.join('\n'); i = j;
        } else { obj[key] = parseScalar(val); i++; }
      }
      return [obj, i];
    }
    return docs.map(d => parseBlock(d, 0, 0)[0]).filter(x => x !== null);
  };
  SM.toYAML = (obj, indent = 0) => {
    const pad = ' '.repeat(indent);
    const q = (s) => { s = SM.str(s); return /^[\w./-][\w ./:()\-,*]*$/.test(s) && !/^(true|false|null|~|\d+)$/.test(s) ? s : JSON.stringify(s); };
    if (Array.isArray(obj)) return obj.map(v => (v && typeof v === 'object') ? pad + '-\n' + SM.toYAML(v, indent + 2).replace(new RegExp('^' + pad + '  ', ''), pad + '  ') : pad + '- ' + q(v)).join('\n');
    if (obj && typeof obj === 'object') return Object.entries(obj).map(([k, v]) => {
      if (v && typeof v === 'object') { const inner = SM.toYAML(v, indent + 2); return pad + k + ':' + (Array.isArray(v) && !v.length ? ' []' : '\n' + inner); }
      if (typeof v === 'string' && v.includes('\n')) return pad + k + ': |\n' + v.split('\n').map(l => pad + '  ' + l).join('\n');
      return pad + k + ': ' + q(v);
    }).join('\n');
    return pad + q(obj);

(function (SM) {
